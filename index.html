const nm=k=>FD[k][0],sh=k=>nm(k).replace(/\s*\(.*\)/,"");
const MEALS=MD.split("\n").map(l=>{
  const [n,t,i,m]=l.split("|"),it=i.split(" ").map(x=>{const [k,g]=x.split(":");return [k,+g]});
  const v=it.reduce((a,[k,g])=>a.map((s,j)=>s+FD[k][j+1]*g/100),[0,0,0,0]);
  return {n,t,m,it,k:Math.round(v[0]),p:Math.round(v[1]),c:Math.round(v[2]),f:Math.round(v[3])};
});

/* ===== الدخول وصلاحية الأيام ===== */
async function init(){const {data}=await sb.auth.getSession();data.session?enter(data.session.user):loginView()}
function loginView(m=""){
  $("app").innerHTML=`<div class="login card"><div style="text-align:center;font-size:30px">${LOGO}</div>
  <p class="mut" style="text-align:center">أهلاً بكِ 👋<br>سجّلي دخولك بالحساب الذي أرسلته لكِ مدرّبتك</p>
  <input id="u" placeholder="اسم المستخدم" dir="ltr" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')signIn()">
  <div class="msg">${m}</div><button class="btn" style="width:100%" onclick="signIn()">دخول</button></div>`;
}
async function signIn(){
  const n=$("u").value.trim().toLowerCase(),p=$("p").value;
  for(const em of n.includes("@")?[n]:["fit."+n+"@"+UD,n+"@"+UD]){
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:p});
    if(!error)return enter(data.user);
  }
  loginView("بيانات الدخول غير صحيحة، تأكدي منها وحاولي مجدداً.");
}
async function enter(u){
  S.me=u.id;
  const {data:pr}=await sb.from("profiles").select("role").eq("id",u.id).maybeSingle();
  if(pr?.role==="owner")S.coach=true;
  else{
    const {data:t}=await sb.from("trainees").select("expires_at,goal").eq("id",u.id).maybeSingle();
    const d=t?Math.ceil((new Date(t.expires_at)-Date.now())/864e5):0;
    if(d<=0){await sb.auth.signOut();return loginView(t?"انتهت صلاحية اشتراكك، تواصلي مع مدرّبتك للتجديد.":"هذا الحساب غير مفعّل.")}
    S.days=d;S.goal=t.goal||"";
  }
  const {data:v}=await sb.from("ex_videos").select("*");
  (v||[]).forEach(x=>S.vid[x.name]=x.url);
  render();
}
async function out(){await sb.auth.signOut();S.coach=false;S.tab="ex";loginView()}

/* ===== الواجهة ===== */
function setTab(k){S.tab=k;k==="co"?loadT():k==="ms"?loadM():render()}
function render(){
  const T=[["ex","🏋️ التمارين"],["cal","🔥 السعرات"],["nu","🥗 التغذية"],["ms",S.coach?"📏 القياسات":"📏 قياساتي"]];
  if(S.coach)T.push(["co","👩‍🤝‍👩 المتدربات"]);
  const V={ex:exView,cal:calView,nu:nuView,ms:mView,co:coView}[S.tab]();
  $("app").innerHTML=`<header>${LOGO}<div class="hb">${S.coach?'<span class="pill">المدرّبة</span>':`<span class="pill">⏳ متبقي ${S.days} يوم</span>`}<button class="btn alt" style="margin:0" onclick="out()">خروج</button></div></header>
  <nav>${T.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</nav><main>${V}</main>`;
}
function exView(){
  const d=DAYS[S.day];
  return `<h2>Home Workout</h2>
  <div class="chips">${DAYS.map((x,i)=>`<button class="chip ${i===S.day?"on":""}" onclick="S.day=${i};render()">${x[1]} ${x[0].split(" · ")[0]}</button>`).join("")}</div>
  <div class="card"><h3>${d[1]} ${d[0]}</h3><div class="tw"><table>
  <tr><th>#</th><th>Exercise</th><th>Sets × Reps</th><th>Rest</th><th>Video</th></tr>
  ${d[2].map((r,i)=>{const u=S.vid[r[0]]||DV[r[0]];return `<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><a class="yt" target="_blank" rel="noopener" href="${u||"https://www.youtube.com/results?search_query="+encodeURIComponent(r[0]+" exercise tutorial")}">▶ Watch</a>${S.coach?` <button class="ev" onclick="editV(${i})">${u?"✏️":"⚠️"}</button>`:""}</td></tr>`}).join("")}
  </table></div></div>`;
}
async function editV(i){
  const n=DAYS[S.day][2][i][0],u=prompt("الصقي رابط فيديو الشرح من يوتيوب للتمرين: "+n+"\n(اتركيه فارغاً لحذف الرابط)",S.vid[n]||DV[n]||"");
  if(u===null)return;
  const v=u.trim();
  if(v&&!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(v))return alert("الرابط غير صحيح، يجب أن يكون رابطاً من يوتيوب");
  const {error}=v?await sb.from("ex_videos").upsert({name:n,url:v}):await sb.from("ex_videos").delete().eq("name",n);
  if(error)return alert(error.message);
  v?S.vid[n]=v:delete S.vid[n];render();
}
function calView(){
  return `<h2>Calorie Calculator</h2><div class="card">
  <label>العمر (سنة)</label><input id="ca" type="number" inputmode="decimal">
  <label>الوزن (كغ)</label><input id="cw" type="number" inputmode="decimal">
  <label>الطول (سم)</label><input id="ch" type="number" inputmode="decimal">
  <label>مستوى النشاط</label><select id="cf"><option value="1.2">قليل الحركة (بدون تمارين)</option><option value="1.375" selected>نشاط خفيف (1–3 أيام أسبوعياً)</option><option value="1.55">نشاط متوسط (3–5 أيام)</option><option value="1.725">نشاط مرتفع (6–7 أيام)</option></select>
  <label>الهدف</label><select id="cg"><option value="lose">خسارة الوزن</option><option value="maintain">ثبات الوزن</option><option value="gain">زيادة الوزن وبناء العضلات</option></select>
  <button class="btn" style="width:100%" onclick="calc()">احسبي احتياجك</button></div>
  <div class="card" id="res"><p class="mut">أدخلي بياناتك ثم اضغطي «احسبي احتياجك».</p></div>`;
}
function calc(){
  const a=+$("ca").value,w=+$("cw").value,h=+$("ch").value,f=+$("cf").value,g=$("cg").value;
  if(!(a>0&&w>0&&h>0))return alert("يرجى إدخال العمر والوزن والطول");
  const bmr=10*w+6.25*h-5*a-161,tdee=bmr*f;
  const t=Math.max(1200,g==="lose"?tdee-500:g==="gain"?tdee+300:tdee);
  const pr=w*(g==="lose"?2:1.8),fat=t*.25/9,carb=Math.max(0,(t-pr*4-fat*9)/4),r=x=>Math.round(x/10)*10;
  $("res").innerHTML=`<div class="big">${r(t)}<small> kcal / day</small></div>
  <p class="mut" style="text-align:center">احتياجك اليومي من السعرات لتحقيق هدفك${t===1200?" (تم ضبطه على الحد الأدنى الآمن)":""}</p>
  <div class="g3"><div><b>${r(bmr)}</b><span>معدل الحرق الأساسي (BMR)</span></div><div><b>${r(tdee)}</b><span>إجمالي الحرق اليومي (TDEE)</span></div>
  <div><b>${Math.round(pr)}g</b><span>بروتين</span></div><div><b>${Math.round(carb)}g</b><span>كربوهيدرات</span></div><div><b>${Math.round(fat)}g</b><span>دهون</span></div></div>`;
}
function mealCard(m){
  const s=ST[m.m].replace("{1}",sh(m.it[0][0])).replace("{2}",m.it[1]?sh(m.it[1][0]):"");
  return `<div class="meal"><div class="mi"><span>${EM[m.m]}</span><img src="https://images.unsplash.com/${IM[m.m]}?auto=format&fit=crop&w=800&q=70" loading="lazy" alt="" onerror="this.remove()"></div>
  <div class="mb"><div class="tags"><span>${TY[m.t]}</span></div><h3>${m.n}</h3>
  <div class="tags"><span>🔥 ${m.k} kcal</span><span>P ${m.p}g</span><span>C ${m.c}g</span><span>F ${m.f}g</span></div>
  <ul>${m.it.map(([k,g])=>`<li>${nm(k)} — ${g} جم${PC[k]?` (${Math.round(g/PC[k][0]*2)/2} ${PC[k][1]})`:""}</li>`).join("")}</ul>
  <details><summary>طريقة التحضير</summary><p>${s}</p></details></div></div>`;
}
function nuView(){
  const L=MEALS.filter(m=>S.mf==="all"||m.t===S.mf);
  return `<h2>Healthy Meals</h2><div class="chips">${[["all","الكل"],...Object.entries(TY)].map(([k,v])=>`<button class="chip ${S.mf===k?"on":""}" onclick="S.mf='${k}';render()">${v}</button>`).join("")}</div>
  <div class="meals">${L.map(mealCard).join("")}</div>`;
}

/* ===== القياسات ===== */
const MC=["weight","waist","hips","chest","arm","thigh"],MH=["الوزن (كغ)","الخصر (سم)","الأرداف (سم)","الصدر (سم)","الذراع (سم)","الفخذ (سم)"];
async function loadM(){
  if(S.coach){
    if(!S.list.length){const {data}=await sb.from("trainees").select("*").order("created_at",{ascending:false});S.list=data||[]}
    if(!S.sel||!S.list.find(x=>x.id===S.sel))S.sel=S.list[0]?.id||"";
  }else S.sel=S.me;
  if(!S.sel){S.rows=[];return render()}
  const {data}=await sb.from("measurements").select("*").eq("trainee_id",S.sel).order("d");
  S.rows=data||[];render();
}
function mView(){
  const c=S.coach,r=S.rows,t=S.list.find(x=>x.id===S.sel);
  if(c&&!S.list.length)return `<h2>Measurements</h2><div class="card"><p class="mut">أضيفي متدربة أولاً من تبويب «المتدربات».</p></div>`;
  const head=c?`<select onchange="S.sel=this.value;loadM()">${S.list.map(x=>`<option value="${x.id}" ${x.id===S.sel?"selected":""}>${esc(x.username)}</option>`).join("")}</select>
  <label>هدف المتدربة</label><input value="${esc(t?.goal)}" placeholder="مثال: خسارة 6 كغ خلال 3 أشهر" onchange="saveGoal(this.value)">`
  :`<p><b>🎯 هدفك:</b> ${esc(S.goal)||"ستحدّده مدرّبتك قريباً"}</p>`;
  const f=r[0],l=r[r.length-1],dl=k=>{if(r.length<2||f[k]==null||l[k]==null)return "-";const d=Math.round((l[k]-f[k])*10)/10;return (d>0?"+":"")+d};
  const sum=r.length>1?`<div class="g3">${[0,1,2].map(i=>`<div><b dir="ltr">${dl(MC[i])}</b><span>تغيّر ${MH[i].split(" (")[0]} منذ البداية</span></div>`).join("")}</div>`:"";
  const cell=(x,k,v)=>c?`<input type="number" step="0.1" inputmode="decimal" value="${v??""}" onchange="upM('${x.id}','${k}',this.value)">`:(v??"-");
  return `<h2>Measurements</h2><div class="card">${head}${sum}</div>
  <div class="card"><div class="tw"><table class="mt"><tr><th>التاريخ</th>${MH.map(h=>`<th>${h}</th>`).join("")}${c?"<th></th>":""}</tr>
  ${r.map(x=>`<tr><td>${c?`<input type="date" value="${x.d}" onchange="upM('${x.id}','d',this.value)">`:new Date(x.d).toLocaleDateString("ar")}</td>${MC.map(k=>`<td>${cell(x,k,x[k])}</td>`).join("")}${c?`<td><button class="x" onclick="delM('${x.id}')">✕</button></td>`:""}</tr>`).join("")||`<tr><td colspan="8" class="mut">لا توجد قياسات مسجّلة بعد</td></tr>`}
  </table></div>${c?`<button class="btn" onclick="addM()">＋ إضافة قياس جديد</button>`:""}</div>`;
}
async function upM(id,k,v){
  const val=v===""?null:k==="d"?v:+v,{error}=await sb.from("measurements").update({[k]:val}).eq("id",id);
  if(error)return alert(error.message);
  const x=S.rows.find(y=>y.id===id);if(x)x[k]=val;
}
async function addM(){
  const l=S.rows[S.rows.length-1],base=l?Object.fromEntries(MC.map(k=>[k,l[k]])):{};
  const {error}=await sb.from("measurements").insert({trainee_id:S.sel,...base});
  if(error)return alert(error.message);loadM();
}
async function delM(id){if(!confirm("حذف هذا القياس؟"))return;await sb.from("measurements").delete().eq("id",id);loadM()}
async function saveGoal(v){
  const {error}=await sb.from("trainees").update({goal:v.trim()||null}).eq("id",S.sel);
  if(error)return alert(error.message);
  const t=S.list.find(x=>x.id===S.sel);if(t)t.goal=v.trim();
}

/* ===== لوحة المدرّبة ===== */
const pw=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
function coView(){
  return `<h2>إنشاء حساب متدربة</h2><div class="card">
  <label>اسم المستخدم (أحرف إنجليزية وأرقام)</label><input id="tu" dir="ltr" autocapitalize="none">
  <label>كلمة المرور</label><input id="tp" dir="ltr" value="${pw()}">
  <label>مدة الاشتراك (بالأيام)</label><input id="td" type="number" min="1" value="30">
  <button class="btn" id="tb" onclick="addT()">إنشاء الحساب</button>
  ${S.cred?`<div class="cred">${esc(S.cred)}</div><button class="btn alt" onclick="navigator.clipboard.writeText(S.cred);this.textContent='تم النسخ'">نسخ البيانات</button>`:""}</div>
  <h2>المتدربات</h2><div class="card">${S.list.some(x=>new Date(x.expires_at)<Date.now())?'<button class="btn alt" onclick="delExp()">🗑 حذف جميع الحسابات المنتهية</button>':''}${S.list.map(x=>{const d=Math.ceil((new Date(x.expires_at)-Date.now())/864e5);
  return `<div class="row"><div><b>${esc(x.username)}</b><br><span class="mut">${d>0?"متبقي "+d+" يوم":"منتهي"} · ${new Date(x.expires_at).toLocaleDateString("ar")}</span></div>
  <div class="ctl"><input id="d_${x.id}" type="number" min="0" value="${Math.max(d,0)}"><button onclick="setD('${x.id}')">حفظ الأيام</button><button onclick="stopT('${x.id}')">إيقاف</button><button onclick="delT('${x.id}')">🗑 حذف</button></div></div>`}).join("")||'<p class="mut">لا توجد متدربات بعد</p>'}</div>`;
}
async function loadT(){
  const {data}=await sb.from("trainees").select("*").order("created_at",{ascending:false});
  S.list=data||[];render();
}
async function addT(){
  const u=$("tu").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),p=$("tp").value,d=parseInt($("td").value);
  if(u.length<3||p.length<6||!(d>0))return alert("تأكدي من اسم المستخدم (3 أحرف فأكثر) وكلمة المرور (6 فأكثر) وعدد الأيام");
  $("tb").disabled=true;
  const {data,error}=await sb2.auth.signUp({email:"fit."+u+"@"+UD,password:p});
  if(error){$("tb").disabled=false;return alert(/already|registered/i.test(error.message)?"اسم المستخدم مستخدم، اختاري غيره":error.message)}
  const {error:e2}=await sb.from("trainees").insert({id:data.user.id,username:u,expires_at:new Date(Date.now()+d*864e5).toISOString()});
  sb2.auth.signOut().catch(()=>{});
  if(e2){$("tb").disabled=false;return alert(e2.message)}
  S.cred=`الموقع: ${location.href.split("?")[0]}\nاسم المستخدم: ${u}\nكلمة المرور: ${p}\nمدة الاشتراك: ${d} يوم`;
  loadT();
}
async function setD(id){
  const n=parseInt($("d_"+id).value);
  if(!(n>=0))return alert("اكتبي عدد أيام صحيحاً");
  const {error}=await sb.from("trainees").update({expires_at:new Date(Date.now()+n*864e5).toISOString()}).eq("id",id);
  if(error)return alert(error.message);loadT();
}
async function stopT(id){
  if(!confirm("إيقاف هذا الحساب الآن؟"))return;
  await sb.from("trainees").update({expires_at:new Date().toISOString()}).eq("id",id);loadT();
}
async function delT(id){
  const t=S.list.find(x=>x.id===id);
  if(!confirm("حذف حساب "+t.username+" نهائياً مع كل قياساتها؟ لا يمكن التراجع."))return;
  const {error}=await sb.rpc("delete_trainee",{tid:id});
  if(error)return alert(error.message);
  S.sel="";loadT();
}
async function delExp(){
  const n=S.list.filter(x=>new Date(x.expires_at)<Date.now()).length;
  if(!n||!confirm("حذف "+n+" حساب منتهٍ نهائياً مع كل قياساتها؟ لا يمكن التراجع."))return;
  const {error}=await sb.rpc("delete_expired_trainees");
  if(error)return alert(error.message);
  S.sel="";loadT();
}

init();
</script>
