<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Women's Fit Club</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{--a:#ff4d8d;--b:#ff8a3d;--bg:#0b0b10;--card:#16161fcc;--line:#ffffff1f;--mut:#aab}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;color:#fff;background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#0b0b10b3,#0b0b10f5),url(https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=60) center/cover}
h1,h2,h3{font-family:'Oswald','Tajawal',sans-serif;letter-spacing:.5px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:16px 20px}
.logo{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.hb{display:flex;gap:8px;align-items:center;font-size:13px}
.pill{background:#ffffff1f;border-radius:20px;padding:6px 14px}
button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;border-radius:12px;padding:11px 22px;font-weight:700;margin:4px 0}
.btn.alt{background:#ffffff26}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;position:sticky;top:0;z-index:5;background:#0b0b10cc;backdrop-filter:blur(8px)}
.tab,.chip{white-space:nowrap;background:#ffffff14;border:1px solid var(--line);color:#fff;border-radius:24px;padding:9px 18px}
.on{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent}
main{max-width:1000px;margin:auto;padding:12px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;backdrop-filter:blur(8px)}
label{font-size:13px;color:var(--mut)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#ffffff12;color:#fff;margin:4px 0 10px;font-family:inherit;font-size:15px}
select option{color:#000}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center;direction:ltr}
th{color:var(--b);font-family:Oswald,sans-serif;font-weight:500}
td:nth-child(2){text-align:left}
.yt{background:#f03;color:#fff;border-radius:8px;padding:5px 12px;text-decoration:none;font-size:13px;white-space:nowrap}
.big{font-family:Oswald,sans-serif;font-size:54px;text-align:center;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.big small{font-size:18px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}
.g3 div{background:#ffffff12;border-radius:12px;padding:12px;text-align:center}
.g3 b{display:block;font-size:22px;font-family:Oswald,sans-serif}.g3 span{font-size:12px;color:var(--mut)}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.meal{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mi{height:190px;position:relative;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#ff4d8d66,#ff8a3d66)}
.mi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb{padding:14px}.mb h3{margin:6px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tags span{background:#ffffff14;border-radius:14px;padding:3px 10px;font-size:12px}
.mb ul{padding-inline-start:18px;margin:8px 0;font-size:14px;line-height:1.8}
details{font-size:14px;color:#dde}summary{cursor:pointer;color:var(--b);font-weight:700}
.login{max-width:380px;margin:12vh auto}
.msg{color:#ff8a8a;min-height:20px;font-size:14px}
.cred{white-space:pre-wrap;direction:ltr;text-align:left;background:#ffffff12;border-radius:10px;padding:10px;margin:8px 0;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0}
.row button{padding:6px 12px;border-radius:8px;border:0;background:#ffffff26;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== الإعدادات: ضع رابط ومفتاح مشروع Supabase الجديد هنا ===== */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={coach:false,days:0,tab:"ex",day:0,list:[],cred:""};

/* ===== التمارين ===== */
const DAYS=[
["Day 1 · Lower Body","🦵",[["Bodyweight Squat","3 × 15","45s"],["Glute Bridge","3 × 15","45s"],["Reverse Lunge","3 × 10 each","60s"],["Sumo Squat","3 × 12","45s"],["Calf Raise","3 × 20","30s"]]],
["Day 2 · Upper Body & Core","💪",[["Incline Push-Up","3 × 10","60s"],["Superman","3 × 12","45s"],["Plank","3 × 30-45s","45s"],["Dead Bug","3 × 10 each","45s"],["Bench Tricep Dips","3 × 10","60s"]]],
["Day 3 · Cardio HIIT","🔥",[["Jumping Jacks","4 × 40s","20s"],["High Knees","4 × 40s","20s"],["Mountain Climbers","4 × 40s","20s"],["Skater Jumps","4 × 40s","20s"],["Squat Jumps","4 × 30s","30s"]]],
["Day 4 · Glutes & Core","🍑",[["Donkey Kicks","3 × 15 each","30s"],["Fire Hydrants","3 × 15 each","30s"],["Single Leg Glute Bridge","3 × 10 each","45s"],["Bicycle Crunch","3 × 20","30s"],["Russian Twist","3 × 20","30s"],["Side Plank","3 × 25s each","30s"]]],
["Day 5 · Full Body","⚡",[["Squat to Press","3 × 12","60s"],["Bent Over Row","3 × 12","60s"],["Glute Bridge March","3 × 12","45s"],["Bear Plank Shoulder Tap","3 × 10 each","45s"],["Burpee (no jump)","3 × 8","60s"]]],
["Day 6-7 · Recovery","🧘",[["Brisk Walk","30-45 min","-"],["Cat Cow Stretch","2 × 10","-"],["Child's Pose","3 × 30s","-"],["Hamstring Stretch","2 × 30s each","-"],["Hip Flexor Stretch","2 × 30s each","-"]]]
];

/* ===== الوجبات ===== */
const MEALS=[
{n:"بان كيك الموز والشوفان",t:"فطور",e:"🥞",img:"photo-1528207776546-365bb710ee93",k:520,p:23,c:78,f:14,
i:["شوفان — 50 جم","موزة ناضجة متوسطة — 120 جم","بيضتان كبيرتان","حليب أو حليب لوز — 60 مل","بيكنج باودر — ½ ملعقة صغيرة","قرفة — ½ ملعقة صغيرة","توت أزرق — 60 جم","عسل — ملعقة صغيرة (7 جم)"],
s:"اخلطي الشوفان والموز والبيض والحليب والبيكنج باودر والقرفة في الخلاط. اسكبي أقراصاً صغيرة على مقلاة غير لاصقة، دقيقتان لكل وجه، وزيّنيها بالتوت والعسل."},
{n:"بول الدجاج المتوسطي",t:"غداء",e:"🥗",img:"photo-1546069901-ba9599a7e63c",k:580,p:48,c:38,f:24,
i:["صدر دجاج نيء — 150 جم","كينوا مطبوخة — 120 جم","خيار — 80 جم","طماطم كرزية — 80 جم","زيتون كالاماتا — 20 جم","جبنة فيتا — 30 جم","حمص جاهز — 40 جم","زيت زيتون — ملعقة صغيرة","عصير ½ ليمونة وأوريجانو"],
s:"تبّلي الدجاج بالأوريجانو والملح والفلفل واشويه 6-7 دقائق لكل وجه ثم قطّعيه شرائح. رتّبي الكينوا والخضار في صحن، وأضيفي الدجاج والحمص والفيتا، ورشّي الزيت والليمون."},
{n:"سلمون بالليمون مع بطاطس وهليون",t:"عشاء",e:"🐟",img:"photo-1467003909585-2f8a72700288",k:530,p:40,c:40,f:24,
i:["فيليه سلمون — 150 جم","بطاطس صغيرة — 200 جم","هليون — 120 جم","زيت زيتون — ملعقة صغيرة","ثوم — فصان","ليمون — ½ حبة","شبت أو بقدونس طازج"],
s:"اخلطي البطاطس المقطعة بنصف الزيت والثوم وحمّريها في الفرن على 200° لمدة 15 دقيقة. أضيفي السلمون والهليون مدهونين بباقي الزيت والليمون وأعيديها 12 دقيقة، وزيّنيها بالشبت."},
{n:"تاكو الروبيان بصلصة المانجو",t:"عشاء",e:"🌮",img:"photo-1565299585323-38d6b0865b47",k:480,p:35,c:50,f:16,
i:["روبيان مقشر — 150 جم","تورتيلا ذرة صغيرة — 3 أقراص","مانجو مقطعة مكعبات — 80 جم","بصل أحمر — 20 جم","ملفوف أحمر مبشور — 40 جم","أفوكادو — 40 جم","كزبرة وعصير ½ ليمونة","بابريكا وكمون — ملعقة صغيرة","زيت زيتون — ملعقة صغيرة"],
s:"تبّلي الروبيان بالبابريكا والكمون وسوّيه بالزيت دقيقتين لكل وجه. اخلطي المانجو والبصل والكزبرة والليمون لعمل الصلصة. دفّئي التورتيلا واحشيها بالملفوف والروبيان والصلصة والأفوكادو."},
{n:"بارفيه الزبادي اليوناني والتوت",t:"سناك",e:"🍓",img:"photo-1488477181946-6428a0291777",k:350,p:24,c:42,f:9,
i:["زبادي يوناني قليل الدسم — 200 جم","توت مشكل — 100 جم","جرانولا — 30 جم","عسل — ملعقة صغيرة","بذور الشيا — ملعقة صغيرة"],
s:"رتّبي الزبادي والتوت والجرانولا طبقات في كوب، وزيّنيها بالعسل وبذور الشيا."},
{n:"سموذي الشوكولاتة وزبدة الفول السوداني",t:"بعد التمرين",e:"🥤",img:"photo-1553530666-ba11a7da3888",k:400,p:38,c:34,f:13,
i:["حليب قليل الدسم — 250 مل","نصف موزة مجمدة — 60 جم","بروتين باودر — سكوب (30 جم)","زبدة فول سوداني — ملعقة كبيرة (16 جم)","كاكاو غير محلى — ملعقة كبيرة (5 جم)","مكعبات ثلج"],
s:"ضعي كل المكونات في الخلاط واخلطيها 40 ثانية حتى يصبح القوام كريمياً."}
];

/* ===== الدخول وصلاحية الأيام ===== */
async function init(){
  if(!READY)return $("app").innerHTML='<div class="login card"><h2>الإعداد ناقص</h2><p class="mut">افتح الملف وضع رابط ومفتاح مشروع Supabase الجديد في أول السكربت (SBU و SBK).</p></div>';
  const {data}=await sb.auth.getSession();data.session?enter(data.session.user):loginView()
}
function loginView(m=""){
  $("app").innerHTML=`<div class="login card"><h1 class="logo" style="font-size:34px;text-align:center">WOMEN'S FIT CLUB</h1>
  <p class="mut" style="text-align:center">سجّلي دخولك بالحساب المؤقت الذي أرسلته لك المدربة</p>
  <input id="u" placeholder="اسم المستخدم" dir="ltr" autocapitalize="none" autocomplete="username">
  <input id="p" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')signIn()">
  <div class="msg">${m}</div><button class="btn" style="width:100%" onclick="signIn()">دخول</button></div>`;
}
async function signIn(){
  const n=$("u").value.trim().toLowerCase(),p=$("p").value;
  const em=n.includes("@")?n:"fit."+n+"@"+UD;
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:p});
  if(!error)return enter(data.user);
  loginView("اسم المستخدم أو كلمة المرور غير صحيحة");
}
async function enter(u){
  const {data:pr}=await sb.from("profiles").select("role").eq("id",u.id).maybeSingle();
  if(pr?.role==="owner"){S.coach=true;return render()}
  const {data:t}=await sb.from("trainees").select("expires_at").eq("id",u.id).maybeSingle();
  const d=t?Math.ceil((new Date(t.expires_at)-Date.now())/864e5):0;
  if(d<=0){await sb.auth.signOut();return loginView(t?"انتهت صلاحية حسابك، تواصلي مع المدربة للتجديد":"حسابك غير مفعّل")}
  S.days=d;render();
}
async function out(){await sb.auth.signOut();S.coach=false;S.tab="ex";loginView()}

/* ===== الواجهة ===== */
function setTab(k){S.tab=k;k==="co"?loadT():render()}
function render(){
  const T=[["ex","🏋️ التمارين المنزلية"],["cal","🔥 حاسبة السعرات"],["nu","🥗 التغذية"]];
  if(S.coach)T.push(["co","👩‍🤝‍👩 المتدربات"]);
  const V={ex:exView,cal:calView,nu:nuView,co:coView}[S.tab]();
  $("app").innerHTML=`<header><h1 class="logo">WOMEN'S FIT CLUB</h1><div class="hb">${S.coach?'<span class="pill">المدربة</span>':`<span class="pill">⏳ باقي ${S.days} يوم</span>`}<button class="btn alt" onclick="out()">خروج</button></div></header>
  <nav>${T.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join("")}</nav><main>${V}</main>`;
}
function exView(){
  const d=DAYS[S.day];
  return `<h2>Home Workout Plan</h2>
  <p class="mut">البرنامج مبني على توصيات ACSM ومنظمة الصحة العالمية: تمارين مقاومة يومين أسبوعياً على الأقل، و150 دقيقة نشاط متوسط، بمعدل 2-4 مجموعات و8-15 عدّة وراحة 30-90 ثانية. ابدئي بإحماء 5 دقائق واختمي بتمدد 5 دقائق.</p>
  <div class="chips">${DAYS.map((x,i)=>`<button class="chip ${i===S.day?"on":""}" onclick="S.day=${i};render()">${x[1]} ${x[0].split(" · ")[0]}</button>`).join("")}</div>
  <div class="card"><h3>${d[1]} ${d[0]}</h3><div class="tw"><table>
  <tr><th>#</th><th>Exercise</th><th>Sets × Reps</th><th>Rest</th><th>Video</th></tr>
  ${d[2].map((r,i)=>`<tr><td>${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(r[0]+" proper form tutorial")}">▶️ Watch</a></td></tr>`).join("")}
  </table></div></div>`;
}
function calView(){
  return `<h2>Calorie Calculator</h2><div class="card">
  <label>العمر (سنة)</label><input id="ca" type="number" inputmode="decimal">
  <label>الوزن (كجم)</label><input id="cw" type="number" inputmode="decimal">
  <label>الطول (سم)</label><input id="ch" type="number" inputmode="decimal">
  <label>مستوى النشاط</label><select id="cf"><option value="1.2">خامل (بدون تمارين)</option><option value="1.375" selected>خفيف (تمارين 1-3 أيام أسبوعياً)</option><option value="1.55">متوسط (3-5 أيام)</option><option value="1.725">عالٍ (6-7 أيام)</option></select>
  <label>الهدف</label><select id="cg"><option value="lose">إنقاص الوزن</option><option value="maintain">تثبيت الوزن</option><option value="gain">زيادة الوزن / بناء عضل</option></select>
  <button class="btn" style="width:100%" onclick="calc()">احسبي</button></div>
  <div class="card" id="res"><p class="mut">أدخلي بياناتك واضغطي «احسبي».</p></div>
  <p class="mut">المعادلة: Mifflin-St Jeor للنساء (10×الوزن + 6.25×الطول − 5×العمر − 161) مضروبة بمعامل النشاط القياسي. الإنقاص بعجز 500 سعرة (≈0.5 كجم أسبوعياً) والزيادة بفائض 300 سعرة، والبروتين 1.8-2 جم/كجم وفق ISSN. النتائج تقديرية وليست بديلاً عن استشارة مختصة.</p>`;
}
function calc(){
  const a=+$("ca").value,w=+$("cw").value,h=+$("ch").value,f=+$("cf").value,g=$("cg").value;
  if(!(a>0&&w>0&&h>0))return alert("اكتبي العمر والوزن والطول");
  const bmr=10*w+6.25*h-5*a-161,tdee=bmr*f;
  const t=Math.max(1200,g==="lose"?tdee-500:g==="gain"?tdee+300:tdee);
  const pr=w*(g==="lose"?2:1.8),fat=t*.25/9,carb=Math.max(0,(t-pr*4-fat*9)/4),r=x=>Math.round(x/10)*10;
  $("res").innerHTML=`<div class="big">${r(t)}<small> kcal / day</small></div>
  <p class="mut" style="text-align:center">سعراتك اليومية المناسبة لهدفك${t===1200?" (ضُبطت على الحد الأدنى الآمن)":""}</p>
  <div class="g3"><div><b>${r(bmr)}</b><span>BMR الأساسي</span></div><div><b>${r(tdee)}</b><span>TDEE الكلي</span></div>
  <div><b>${Math.round(pr)}g</b><span>بروتين</span></div><div><b>${Math.round(carb)}g</b><span>كربوهيدرات</span></div><div><b>${Math.round(fat)}g</b><span>دهون</span></div></div>`;
}
function nuView(){
  return `<h2>Healthy Meals</h2><p class="mut">وجبات متوازنة بنكهات ممتعة. المكونات للحصة الواحدة، والقيم الغذائية تقريبية (مرجعها USDA FoodData Central).</p>
  <div class="meals">${MEALS.map(m=>`<div class="meal"><div class="mi"><span>${m.e}</span><img src="https://images.unsplash.com/${m.img}?auto=format&fit=crop&w=800&q=70" loading="lazy" alt="" onerror="this.remove()"></div>
  <div class="mb"><div class="tags"><span>${m.t}</span></div><h3>${m.n}</h3>
  <div class="tags"><span>🔥 ${m.k} kcal</span><span>P ${m.p}g</span><span>C ${m.c}g</span><span>F ${m.f}g</span></div>
  <ul>${m.i.map(x=>`<li>${x}</li>`).join("")}</ul><details><summary>طريقة التحضير</summary><p>${m.s}</p></details></div></div>`).join("")}</div>`;
}

/* ===== لوحة المدربة ===== */
const pw=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
function coView(){
  return `<h2>إنشاء حساب متدربة</h2><div class="card">
  <label>اسم المستخدم (أحرف إنجليزية وأرقام)</label><input id="tu" dir="ltr" autocapitalize="none">
  <label>كلمة المرور</label><input id="tp" dir="ltr" value="${pw()}">
  <label>مدة صلاحية الحساب (بالأيام)</label><input id="td" type="number" min="1" value="30">
  <button class="btn" id="tb" onclick="addT()">إنشاء الحساب</button>
  ${S.cred?`<div class="cred">${esc(S.cred)}</div><button class="btn alt" onclick="navigator.clipboard.writeText(S.cred);this.textContent='تم النسخ'">نسخ البيانات</button>`:""}</div>
  <h2>المتدربات</h2><div class="card">${S.list.map(x=>{const d=Math.ceil((new Date(x.expires_at)-Date.now())/864e5);
  return `<div class="row"><div><b>${esc(x.username)}</b><br><span class="mut">${d>0?"باقي "+d+" يوم":"منتهي"} · ${new Date(x.expires_at).toLocaleDateString("ar")}</span></div>
  <div><button onclick="extT('${x.id}',7)">+7 أيام</button> <button onclick="extT('${x.id}',30)">+30</button> <button onclick="stopT('${x.id}')">إيقاف</button></div></div>`}).join("")||'<p class="mut">لا توجد متدربات بعد</p>'}</div>`;
}
async function loadT(){
  const {data}=await sb.from("trainees").select("*").order("created_at",{ascending:false});
  S.list=data||[];render();
}
async function addT(){
  const u=$("tu").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),p=$("tp").value,d=parseInt($("td").value);
  if(u.length<3||p.length<6||!(d>0))return alert("تأكدي من اسم المستخدم (3 أحرف فأكثر) وكلمة المرور (6 فأكثر) وعدد الأيام");
  $("tb").disabled=true;
  const {data,error}=await sb2.auth.signUp({email:"fit."+u+"@"+UD,password:p});
  if(error){$("tb").disabled=false;return alert(/already|registered/i.test(error.message)?"اسم المستخدم مستخدم، اختاري غيره":error.message)}
  const {error:e2}=await sb.from("trainees").insert({id:data.user.id,username:u,expires_at:new Date(Date.now()+d*864e5).toISOString()});
  sb2.auth.signOut().catch(()=>{});
  if(e2){$("tb").disabled=false;return alert(e2.message)}
  S.cred=`الموقع: ${location.href.split("?")[0]}\nاسم المستخدم: ${u}\nكلمة المرور: ${p}\nصالح لمدة ${d} يوم`;
  loadT();
}
async function extT(id,d){
  const t=S.list.find(x=>x.id===id),base=Math.max(Date.now(),new Date(t.expires_at).getTime());
  await sb.from("trainees").update({expires_at:new Date(base+d*864e5).toISOString()}).eq("id",id);loadT();
}
async function stopT(id){
  if(!confirm("إيقاف هذا الحساب الآن؟"))return;
  await sb.from("trainees").update({expires_at:new Date().toISOString()}).eq("id",id);loadT();
}

init();
</script>
</body>
